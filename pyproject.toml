[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anonymous-numerical-fact-graph"
version = "0.1.0"
description = "Anonymous reproducibility package for Numerical Fact Graphs in financial numerical question answering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "joblib>=1.3",
  "lxml>=5.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["requests>=2.31"]

[tool.hatch.build.targets.wheel]
packages = ["src/graph_numeric"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
